name: Skillzgame Project Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Skillzgame Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check required project structure
        shell: bash
        run: |
          set -e

          echo "Checking Skillzgame project..."

          required_files=(
            "package.json"
            "src/App.tsx"
            "src/components/HomeScreen.tsx"
            "src/components/BlockPuzzleDuel.tsx"
            "src/components/AdminPanel.tsx"
            "src/services/backendApi.ts"
            "src/context/AppContext.tsx"
            "server/index.mjs"
            "server/store.mjs"
            "api/index.ts"
            "vercel.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi
            echo "OK: $file"
          done

          echo "Project structure check passed."

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Check server syntax
        run: |
          node --check server/index.mjs
          node --check server/store.mjs
          echo "Server syntax check passed."

      - name: Project check completed
        run: echo "Skillzgame project is healthy."
