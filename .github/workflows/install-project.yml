name: Install Latest Skillzgame Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract latest project
        run: |
          ZIP="Skillzgame-v26-Multiplayer-ProMatch-3-5-7-10-FIXED-V30-APK-GITHUB-1.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP file not found: $ZIP"
            exit 1
          fi

          mkdir -p /tmp/skillz
          unzip -q -o "$ZIP" -d /tmp/skillz

          # ZIP-এর ভেতরের মূল project folder
          ROOT="/tmp/skillz/sg"

          if [ ! -d "$ROOT" ]; then
            echo "Project folder not found: $ROOT"
            echo "ZIP contents:"
            find /tmp/skillz -maxdepth 3 -type f | head -100
            exit 1
          fi

          # বর্তমান repository থেকে পুরোনো project সরানো
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          # নতুন project বসানো
          cp -a "$ROOT"/. .

          # ZIP সরানো
          rm -f "$ZIP"

      - name: Commit latest project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Install Skillzgame V30 Multiplayer Pro Match project"
            git push
          fi
