name: Install Skillzgame Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract latest project
        run: |
          ZIP="Skillzgame-v22-Payment-Methods-Admin-Controls-FINAL.zip"

          mkdir -p /tmp/skillz
          unzip -q -o "$ZIP" -d /tmp/skillz

          ROOT="/tmp/skillz"

          if [ -d "$ROOT/Skillzgame-v22-Payment-Methods-Admin-Controls-FINAL" ]; then
            ROOT="$ROOT/Skillzgame-v22-Payment-Methods-Admin-Controls-FINAL"
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          cp -a "$ROOT"/. .

          rm -f "$ZIP"

      - name: Commit corrected structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Install complete Skillzgame project"
          git push
